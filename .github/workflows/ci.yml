name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install -r services/segmentation/requirements.txt
          pip install -r services/api/requirements.txt
          pip install -r services/ingestion/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --cov=services/segmentation \
            --cov-report=term-missing \
            --cov-report=html:docs/evidence/coverage-html \
            -v --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: docs/evidence/coverage-html/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build
        working-directory: dashboard
        env:
          VITE_API_BASE: /api
        run: npm run build

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up --build -d

      - name: Wait for API health
        run: |
          echo "Waiting for API..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          echo "API is healthy!"

      - name: Wait for Seed to finish
        run: |
          echo "Waiting for Seeder..."
          timeout 120 bash -c 'until docker logs fleet-seeder 2>&1 | grep -q "seed_and_run complete"; do sleep 5; done'
          echo "Seeder finished!"

      - name: Run Smoke Tests
        run: |
          pip install pytest httpx
          API_BASE_URL=http://localhost:8000 DEMO_USERNAME=admin DEMO_PASSWORD=changeme pytest tests/test_smoke.py -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t fleet-api ./services/api

      - name: Build Ingestion image
        run: docker build -t fleet-ingestion ./services/ingestion

      - name: Build Seeder image
        run: docker build -t fleet-seeder ./services/segmentation

      - name: Build Dashboard image
        run: |
          docker build \
            --build-arg VITE_API_BASE=/api \
            --build-arg VITE_DEMO_USERNAME=admin \
            --build-arg VITE_DEMO_PASSWORD=ci-test \
            -t fleet-dashboard ./dashboard
