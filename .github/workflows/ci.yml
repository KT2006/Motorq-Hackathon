name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install -r services/segmentation/requirements.txt
          pip install -r services/api/requirements.txt
          pip install -r services/ingestion/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --cov=services/segmentation \
            --cov-report=term-missing \
            --cov-report=html:docs/evidence/coverage-html \
            -v --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: docs/evidence/coverage-html/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint || true

      - name: Build
        working-directory: dashboard
        env:
          VITE_API_BASE: /api
          VITE_DEMO_USERNAME: admin
          VITE_DEMO_PASSWORD: ci-test-password
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t fleet-api ./services/api

      - name: Build Ingestion image
        run: docker build -t fleet-ingestion ./services/ingestion

      - name: Build Seeder image
        run: docker build -t fleet-seeder ./services/segmentation

      - name: Build Dashboard image
        run: |
          docker build \
            --build-arg VITE_API_BASE=/api \
            --build-arg VITE_DEMO_USERNAME=admin \
            --build-arg VITE_DEMO_PASSWORD=ci-test \
            -t fleet-dashboard ./dashboard
