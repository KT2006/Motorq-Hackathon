# Nginx config for the Fleet Intelligence dashboard.
# Serves built React assets on / and proxies /api/* to the FastAPI container.
# This means VITE_API_BASE=/api works for any environment without hard-coding
# a host IP.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA — catch all routes and serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: /api/* → http://api:8000/*
    # Strips the /api prefix before forwarding.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
