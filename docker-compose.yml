version: '3.8'

services:
  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "80:80"
    depends_on:
      - api
