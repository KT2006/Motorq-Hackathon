version: '3.8'

services:
  # ─────────────────────────────────────────────
  # Infrastructure layer
  # ─────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB:       fleet_db
      POSTGRES_USER:     fleet_user
      POSTGRES_PASSWORD: fleet_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleet_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────
  # Streaming ingestion layer
  # ─────────────────────────────────────────────

  ingestion:
    build:
      context: ./services/ingestion
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override with container-internal hostnames
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://fleet_user:fleet_pass@postgres:5432/fleet_db}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_HOST:             redis
      REDIS_PORT:             "6379"
      TELEMETRY_TOPIC:        telemetry
      INGEST_BATCH_SIZE:      "500"
      LOG_LEVEL:              INFO
    restart: on-failure

  # ─────────────────────────────────────────────
  # One-shot seeder: generates vehicles + events,
  # runs segmentation, runs cost rollup.
  # Exits when done; compose continues.
  # ─────────────────────────────────────────────

  seeder:
    build:
      context: ./services/segmentation
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://fleet_user:fleet_pass@postgres:5432/fleet_db}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    volumes:
      - ./simulator:/app/simulator:ro
      - ./schema.sql:/app/schema.sql:ro
    command: ["python", "-u", "seed_and_run.py"]

  # ─────────────────────────────────────────────
  # Application layer
  # ─────────────────────────────────────────────

  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://fleet_user:fleet_pass@postgres:5432/fleet_db}
      JWT_SECRET:   ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      REDIS_HOST:   redis

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_DEMO_USERNAME: ${DEMO_USERNAME:-admin}
        VITE_DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env for dashboard demo auth}
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
