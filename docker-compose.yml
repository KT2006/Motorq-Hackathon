services:
  # ─────────────────────────────────────────────
  # Infrastructure layer
  # ─────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=1GB", "-c", "wal_buffers=16MB", "-c", "max_wal_size=2GB", "-c", "synchronous_commit=off"]
    environment:
      POSTGRES_DB:       fleet_db
      POSTGRES_USER:     fleet_user
      POSTGRES_PASSWORD: fleet_pass
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleet_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: fleet_user
      DB_PASSWORD: fleet_pass
      DB_HOST: postgres
      DB_PORT: 5432
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U fleet_user -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    tmpfs:
      - /data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:latest
    tmpfs:
      - /var/lib/redpanda/data:uid=101,gid=101
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────
  # Streaming ingestion layer
  # ─────────────────────────────────────────────

  ingestion:
    build:
      context: ./services/ingestion
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Override with container-internal hostnames
      POSTGRES_URL: postgresql://fleet_user:fleet_pass@postgres:5432/fleet_db
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_HOST:             redis
      REDIS_PORT:             "6379"
      TELEMETRY_TOPIC:        telemetry
      INGEST_BATCH_SIZE:      "5000"
      LOG_LEVEL:              INFO
    restart: on-failure

  # ─────────────────────────────────────────────
  # One-shot seeder: generates vehicles + events,
  # runs segmentation, runs cost rollup.
  # Exits when done; compose continues.
  # ─────────────────────────────────────────────

  seeder:
    build:
      context: ./services/segmentation
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_URL: postgresql://fleet_user:fleet_pass@postgres:5432/fleet_db
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SEED_MODE: ${SEED_MODE:-balanced}
      SKIP_IF_SEEDED: "true"
    volumes:
      - ./simulator:/app/simulator:ro
      - ./schema.sql:/app/schema.sql:ro
    command: ["python", "-u", "seed_and_run.py"]

  # ─────────────────────────────────────────────
  # Application layer
  # ─────────────────────────────────────────────

  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_URL: postgresql://fleet_user:fleet_pass@postgres:5432/fleet_db
      JWT_SECRET: ${JWT_SECRET:-motorq-local-demo-only-not-for-production}
      DEMO_USERNAME: ${DEMO_USERNAME:-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-changeme}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL:   ${GROQ_MODEL:-openai/gpt-oss-20b}
      REDIS_HOST:   redis
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_DEMO_USERNAME: ${DEMO_USERNAME:-admin}
        VITE_DEMO_PASSWORD: ${DEMO_PASSWORD:-changeme}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
